<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdNova AI — Follow-Up Center</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101e32;--line:#263b58;--muted:#9aacc4;--cyan:#5de1e6;--white:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:15px/1.5 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:20px 14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;margin:14px 0}.top,.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-size:22px;font-weight:850}.brand span,.msg{color:var(--cyan)}a{color:var(--cyan)}button{background:var(--cyan);color:#06151d;border:0;border-radius:9px;padding:10px 14px;font-weight:750;cursor:pointer}button.secondary{background:#1b2d47;color:white;border:1px solid var(--line)}button:disabled{opacity:.5}.muted,.hint{color:var(--muted)}input,select,textarea{width:100%;background:#091629;color:white;border:1px solid var(--line);border-radius:9px;padding:11px;margin-top:6px;font:inherit}.field{display:block;margin:12px 0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:14px}.list{max-height:580px;overflow:auto}.contact{border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}.contact.active{border-color:var(--cyan);background:#102a3b}.pill{color:var(--cyan);font-size:12px}.hidden{display:none!important}.login{max-width:420px;margin:10vh auto}.item{border-bottom:1px solid var(--line);padding:10px 0;white-space:pre-wrap}.msg{min-height:22px}@media(max-width:750px){.layout{grid-template-columns:1fr}}
</style></head><body><main>
<section id="login" class="panel login"><div class="brand">AdNova <span>AI</span></div><h1>Follow-Up Center</h1><form id="loginForm"><label class="field">Email<input id="email" type="email" required></label><label class="field">Password<input id="password" type="password" required></label><button id="loginBtn">Masuk</button></form><p id="loginMsg" class="msg"></p></section>
<section id="app" class="hidden"><header class="top"><div><div class="brand">AdNova <span>AI</span> / Follow-Up Center</div><div class="muted">Pengingat, respons, dan draf WhatsApp AI</div></div><div class="actions"><a href="./">← Kembali ke CRM</a><button class="secondary" id="refresh">Refresh</button><button id="logout">Keluar</button></div></header>
<div class="layout"><section class="panel"><h2>Prospek & pengingat</h2><label class="field">Cari kontak<input id="search" placeholder="Nama atau perusahaan"></label><label class="field">Filter<select id="filter"><option value="">Semua kontak</option><option value="due">Follow-up jatuh tempo</option><option value="awaiting_response">Menunggu respons</option><option value="responded">Sudah merespons</option><option value="high">Prioritas tinggi (70+)</option></select></label><p id="listMsg" class="msg"></p><div id="contacts" class="list"></div></section>
<section class="panel"><h2 id="selectedName">Pilih kontak</h2><div id="selectedInfo" class="muted">Pilih prospek di daftar sebelah kiri.</div><div id="controls" class="hidden">
<label class="field">Tujuan follow-up<input id="objective" value="Menanyakan perkembangan kebutuhan dan menawarkan bantuan"></label><label class="field">Nada pesan<select id="tone"><option value="friendly">Ramah</option><option value="professional">Profesional</option><option value="warm">Hangat</option><option value="concise">Singkat</option></select></label><button id="generate">Buat draf WhatsApp dengan AI</button><p id="aiMsg" class="msg"></p><label class="field">Draf pesan (periksa sebelum dikirim)<textarea id="draft" rows="7" placeholder="Draf AI muncul di sini."></textarea></label><div class="actions"><button class="secondary" id="copy">Salin pesan</button><span id="score" class="pill"></span></div><hr style="border-color:var(--line);margin:18px 0">
<label class="field">Jadwal follow-up berikutnya<input id="followupDate" type="datetime-local"></label><div class="actions"><button id="saveDate">Simpan pengingat</button><button class="secondary" id="responded">Tandai sudah merespons</button></div><p id="saveMsg" class="msg"></p><h3>Riwayat komunikasi</h3><div id="history"></div></div></section></div></section>
</main><script src="../config.js"></script><script>
(()=>{const cfg=window.ADNOVA_SUPABASE||{},$=id=>document.getElementById(id);if(!cfg.url||!cfg.anonKey||!window.supabase){$('loginMsg').textContent='Konfigurasi Supabase tidak terbaca.';return}const db=window.supabase.createClient(cfg.url,cfg.anonKey);let user=null,contacts=[],selected=null;const say=(id,t)=>$(id).textContent=t||'';const show=on=>{$('login').classList.toggle('hidden',on);$('app').classList.toggle('hidden',!on)};
async function check(){const {data:{session}}=await db.auth.getSession();if(!session){show(false);return}if(session.user.app_metadata?.role!=='admin'){await db.auth.signOut();show(false);say('loginMsg','Akses admin diperlukan.');return}user=session.user;show(true);await load()}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginBtn').disabled=false;if(error){say('loginMsg',error.message);return}await check()};
$('logout').onclick=async()=>{await db.auth.signOut();show(false)};$('refresh').onclick=load;
async function load(){say('listMsg','Memuat kontak…');const {data,error}=await db.from('crm_contacts').select('*').order('priority_score',{ascending:false}).limit(500);if(error){say('listMsg','Gagal memuat: '+error.message);return}contacts=data||[];render();say('listMsg',contacts.length+' kontak tersedia.')}
function render(){const q=$('search').value.toLowerCase(),f=$('filter').value,now=Date.now();const rows=contacts.filter(c=>(!q||[c.contact_name,c.company,c.email].some(v=>(v||'').toLowerCase().includes(q)))&&(!f||(f==='due'&&c.next_follow_up_at&&new Date(c.next_follow_up_at).getTime()<=now&&!['won','lost'].includes(c.stage))||(f==='high'&&(c.priority_score||0)>=70)||(f===c.response_status)));const box=$('contacts');box.replaceChildren();if(!rows.length){box.textContent='Tidak ada kontak yang cocok.';return}for(const c of rows){const d=document.createElement('div');d.className='contact'+(selected&&selected.id===c.id?' active':'');d.onclick=()=>select(c);const name=document.createElement('strong');name.textContent=c.contact_name;const detail=document.createElement('div');detail.className='muted';detail.textContent=(c.company||'Tanpa perusahaan')+' · '+(c.stage||'new');const score=document.createElement('div');score.className='pill';score.textContent='Prioritas '+(c.priority_score??50)+'/100 · '+(c.response_status==='responded'?'Sudah merespons':'Menunggu respons');const due=document.createElement('div');due.className='muted';due.textContent=c.next_follow_up_at?'Follow-up: '+new Date(c.next_follow_up_at).toLocaleString('id-ID'):'Belum dijadwalkan';d.append(name,detail,score,due);box.append(d)}}
async function select(c){selected=c;$('selectedName').textContent=c.contact_name;$('selectedInfo').textContent=[c.company,c.industry,c.service_interest,c.estimated_budget].filter(Boolean).join(' · ')||'Detail prospek';$('controls').classList.remove('hidden');$('draft').value='';$('score').textContent='Skor '+(c.priority_score??50)+'/100';$('followupDate').value=c.next_follow_up_at?new Date(new Date(c.next_follow_up_at).getTime()-new Date(c.next_follow_up_at).getTimezoneOffset()*60000).toISOString().slice(0,16):'';say('aiMsg','');say('saveMsg','');render();await history()}
async function history(){const {data,error}=await db.from('crm_activities').select('*').eq('contact_id',selected.id).order('activity_at',{ascending:false}).limit(30);const box=$('history');box.replaceChildren();if(error){box.textContent='Gagal memuat riwayat: '+error.message;return}if(!data?.length){box.textContent='Belum ada riwayat komunikasi.';return}for(const a of data){const d=document.createElement('div');d.className='item';const title=document.createElement('strong');title.textContent=a.subject+' · '+a.activity_type;const date=document.createElement('div');date.className='muted';date.textContent=new Date(a.activity_at).toLocaleString('id-ID');const p=document.createElement('div');p.textContent=a.notes||'';d.append(title,date,p);box.append(d)}}
$('generate').onclick=async()=>{if(!selected)return;const b=$('generate');b.disabled=true;say('aiMsg','Gemini sedang membuat draf…');const {data,error}=await db.functions.invoke('ai-client-followup',{body:{contactId:selected.id,objective:$('objective').value,tone:$('tone').value,language:'Bahasa Indonesia'}});b.disabled=false;if(error){let detail=error.message||'Gagal memanggil AI';try{const body=await error.context.json();detail=body.error||detail}catch{}say('aiMsg',detail);return}if(!data||!data.message){say('aiMsg','AI tidak mengembalikan pesan.');return}$('draft').value=data.message;$('score').textContent='Prioritas '+data.priority_score+'/100 · '+data.priority_reason;say('aiMsg','Draf tersimpan di riwayat komunikasi. Tidak dikirim otomatis.');await load();await history()};
$('copy').onclick=async()=>{if(!$('draft').value)return;try{await navigator.clipboard.writeText($('draft').value);say('aiMsg','Pesan disalin.')}catch{say('aiMsg','Salin manual dari kotak draf.')}};
$('saveDate').onclick=async()=>{if(!selected)return;const value=$('followupDate').value?new Date($('followupDate').value).toISOString():null;const {error}=await db.from('crm_contacts').update({next_follow_up_at:value,updated_at:new Date().toISOString()}).eq('id',selected.id);if(error){say('saveMsg','Gagal menyimpan: '+error.message);return}selected.next_follow_up_at=value;say('saveMsg','Pengingat follow-up tersimpan.');await load()};
$('responded').onclick=async()=>{if(!selected)return;const {error}=await db.from('crm_contacts').update({response_status:'responded',last_response_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',selected.id);if(error){say('saveMsg','Gagal update: '+error.message);return}selected.response_status='responded';say('saveMsg','Kontak ditandai sudah merespons.');await load()};
$('search').oninput=render;$('filter').onchange=render;db.auth.onAuthStateChange(()=>check());check();
})();
</script></body></html>
